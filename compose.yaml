services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - "./keycloak/rag-realm.json:/opt/keycloak/data/import/rag-realm.json:ro"
      - "keycloak-data:/opt/keycloak/data"
  keycloak-admin-init:
    image: quay.io/keycloak/keycloak:26.4
    depends_on:
      keycloak:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_EMAIL: ${KEYCLOAK_ADMIN_EMAIL:-admin@localhost}
      KEYCLOAK_ADMIN_FIRST_NAME: ${KEYCLOAK_ADMIN_FIRST_NAME:-RAG}
      KEYCLOAK_ADMIN_LAST_NAME: ${KEYCLOAK_ADMIN_LAST_NAME:-Administrator}
    command:
      - |
        set -eu
        attempts=0
        until /opt/keycloak/bin/kcadm.sh config credentials \
          --server http://keycloak:8080 --realm master \
          --user "$$KEYCLOAK_ADMIN_USERNAME" --password "$$KEYCLOAK_ADMIN_PASSWORD" \
          >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then
            echo "Unable to authenticate to Keycloak; check its bootstrap admin credentials." >&2
            exit 1
          fi
          sleep 2
        done
        /opt/keycloak/bin/kcadm.sh update realms/rag -s registrationEmailAsUsername=false
        if ! /opt/keycloak/bin/kcadm.sh get users -r rag \
          -q username="$$KEYCLOAK_ADMIN_USERNAME" \
          | grep -Fq "\"username\" : \"$$KEYCLOAK_ADMIN_USERNAME\""; then
          /opt/keycloak/bin/kcadm.sh create users -r rag \
            -s username="$$KEYCLOAK_ADMIN_USERNAME" -s email="$$KEYCLOAK_ADMIN_EMAIL" \
            -s firstName="$$KEYCLOAK_ADMIN_FIRST_NAME" -s lastName="$$KEYCLOAK_ADMIN_LAST_NAME" \
            -s emailVerified=true -s enabled=true
          /opt/keycloak/bin/kcadm.sh set-password -r rag \
            --username "$$KEYCLOAK_ADMIN_USERNAME" --new-password "$$KEYCLOAK_ADMIN_PASSWORD"
        fi
        user_id=$$(/opt/keycloak/bin/kcadm.sh get users -r rag \
          -q username="$$KEYCLOAK_ADMIN_USERNAME" \
          | sed -n 's/.*"id" : "\([^"]*\)".*/\1/p' | head -n 1)
        if [ -z "$$user_id" ]; then
          echo "Unable to find the configured Keycloak realm admin user." >&2
          exit 1
        fi
        /opt/keycloak/bin/kcadm.sh update "users/$$user_id" -r rag \
          -s firstName="$$KEYCLOAK_ADMIN_FIRST_NAME" -s lastName="$$KEYCLOAK_ADMIN_LAST_NAME"
        /opt/keycloak/bin/kcadm.sh add-roles -r rag \
          --uusername "$$KEYCLOAK_ADMIN_USERNAME" --rolename ADMIN
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${DATABASE_USERNAME:-rag}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-rag}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "rag-data:/var/lib/postgresql/data"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${DATABASE_USERNAME:-rag} -d ${POSTGRES_DB:-rag}"
      interval: 5s
      timeout: 3s
      retries: 10
  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - "rustfs-data:/data"
  s3-init:
    image: amazon/aws-cli:2.42.3
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-rag-documents}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
          sleep 2
        done
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1 ||
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$S3_BUCKET"
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      keycloak-admin-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/rag
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-rag-documents}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/rag
      KEYCLOAK_AUTHORIZATION_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/rag/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/rag/protocol/openid-connect/token
      KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/rag/protocol/openid-connect/userinfo
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/rag/protocol/openid-connect/certs
      KEYCLOAK_END_SESSION_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/rag/protocol/openid-connect/logout
    ports:
      - "127.0.0.1:8080:8080"
  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    profiles: ["cloudflare-tunnel"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_started
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?set CLOUDFLARED_TUNNEL_TOKEN}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
  portainer:
    image: portainer/portainer-ce:2.45.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "portainer-data:/data"
volumes:
  keycloak-data:
  rag-data:
  rustfs-data:
  portainer-data:
