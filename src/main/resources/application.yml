spring:
  application.name: genai-rag-mvp
  config.import: optional:file:.env[.properties]
  data.redis:
    host: ${RAG_CACHE_REDIS_HOST:localhost}
    port: ${RAG_CACHE_REDIS_PORT:6379}
    connect-timeout: ${RAG_CACHE_REDIS_CONNECT_TIMEOUT:500ms}
    timeout: ${RAG_CACHE_REDIS_TIMEOUT:500ms}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${DATABASE_USERNAME:rag}
    password: ${DATABASE_PASSWORD:rag}
  flyway:
    enabled: true
    placeholders:
      embeddingDimensions: 1536
      targetEmbeddingDimensions: ${RAG_EMBEDDING_DIMENSIONS:3584}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:rag-assistant}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/rag}
            authorization-uri: ${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/rag/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/rag/protocol/openid-connect/token}
            user-info-uri: ${KEYCLOAK_USER_INFO_URI:http://localhost:8180/realms/rag/protocol/openid-connect/userinfo}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/rag/protocol/openid-connect/certs}
            end-session-uri: ${KEYCLOAK_END_SESSION_URI:http://localhost:8180/realms/rag/protocol/openid-connect/logout}
            user-name-attribute: sub
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/rag}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/rag/protocol/openid-connect/certs}
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
app.s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY:local-access-key}
  secret-key: ${S3_SECRET_KEY:local-secret-key}
  bucket: ${S3_BUCKET:rag-documents}
app.antivirus:
  host: ${CLAMAV_HOST:localhost}
  port: ${CLAMAV_PORT:3310}
  timeout-ms: ${CLAMAV_TIMEOUT_MS:30000}
management.endpoints.web.exposure.include: health,info,metrics
management.endpoint.health.probes.enabled: true
server.forward-headers-strategy: framework
rag:
  provider: ${RAG_PROVIDER:offline}
  cache:
    max-entries: ${RAG_CACHE_MAX_ENTRIES:1000}
    ttl-seconds: ${RAG_CACHE_TTL_SECONDS:300}
  provider-limits:
    max-concurrent-calls: ${RAG_PROVIDER_MAX_CONCURRENT_CALLS:8}
  offline-agent-planner:
    provider: ${RAG_OFFLINE_AGENT_PLANNER:deterministic}
    ollama:
      base-url: ${RAG_OFFLINE_AGENT_PLANNER_BASE_URL:http://host.docker.internal:11434}
      model: ${RAG_OFFLINE_AGENT_PLANNER_MODEL:gemma4:31b}
      timeout-ms: ${RAG_OFFLINE_AGENT_PLANNER_TIMEOUT_MS:180000}
  ollama:
    base-url: ${RAG_OLLAMA_BASE_URL:http://host.docker.internal:11434}
    chat-model: ${RAG_OLLAMA_CHAT_MODEL:gemma4:12b-mlx}
    context-tokens: ${RAG_OLLAMA_CONTEXT_TOKENS:32768}
    embedding-model: ${RAG_OLLAMA_EMBEDDING_MODEL:embeddinggemma-2}
    rerank-provider: ${RAG_OLLAMA_RERANK_PROVIDER:infomaniak}
    rerank-model: ${RAG_OLLAMA_RERANK_MODEL:AuditAid/Qwen3_Reranker:0.6B_Q8}
    request-timeout-ms: ${RAG_OLLAMA_REQUEST_TIMEOUT_MS:180000}
    embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:768}
  embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:3584}
  guardrails:
    denied-topics: ${RAG_GUARDRAILS_DENIED_TOPICS:}
    max-completion-tokens: ${RAG_GUARDRAILS_MAX_COMPLETION_TOKENS:512}
  infomaniak:
    product-id: ${INFOMANIAK_AI_PRODUCT_ID:}
    api-key: ${INFOMANIAK_AI_API_KEY:}
    chat-model: ${INFOMANIAK_AI_CHAT_MODEL:}
    agent-planner-model: ${INFOMANIAK_AI_AGENT_PLANNER_MODEL:google/gemma-4-31B-it}
    embedding-model: ${INFOMANIAK_AI_EMBEDDING_MODEL:}
    rerank-model: ${INFOMANIAK_AI_RERANK_MODEL:}
    request-timeout-ms: ${INFOMANIAK_AI_REQUEST_TIMEOUT_MS:60000}
    connect-timeout-ms: ${INFOMANIAK_AI_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${INFOMANIAK_AI_READ_TIMEOUT_MS:60000}
    max-retries: ${INFOMANIAK_AI_MAX_RETRIES:1}
    transcription:
      poll-interval-ms: ${INFOMANIAK_AI_TRANSCRIPTION_POLL_INTERVAL_MS:2000}
      timeout-ms: ${INFOMANIAK_AI_TRANSCRIPTION_TIMEOUT_MS:300000}
