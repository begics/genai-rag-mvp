apiVersion: apps/v1
kind: Deployment
metadata: {name: genai-rag, namespace: genai-rag}
spec:
  replicas: 1
  selector: {matchLabels: {app: genai-rag}}
  template:
    metadata: {labels: {app: genai-rag}}
    spec:
      containers:
        - name: app
          image: genai-rag-mvp:local
          ports: [{containerPort: 8080}]
          envFrom:
            - {configMapRef: {name: genai-rag-config}}
            - {secretRef: {name: genai-rag-secrets}}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 30, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: genai-rag, namespace: genai-rag}
spec:
  type: ClusterIP
  selector: {app: genai-rag}
  ports: [{port: 80, targetPort: 8080}]
